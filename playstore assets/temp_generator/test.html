<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 100px;
    overflow: hidden;
  }
  .badge {
    background: rgba(99, 102, 241, 0.2);
    border: 2px solid #818cf8;
    color: #c7d2fe;
    font-size: 26px;
    font-weight: 700;
    padding: 12px 32px;
    border-radius: 999px;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }
  .title {
    font-size: 64px;
    font-weight: 800;
    text-align: center;
    line-height: 1.2;
    background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 16px;
    max-width: 900px;
  }
  .sub {
    font-size: 32px;
    color: #94a3b8;
    text-align: center;
    margin-bottom: 60px;
  }
</style>
</head>
<body>
  <div class="badge">⚡ 60 FPS HD LIVE CALLS</div>
  <h1 class="title">Practice Speaking With Real-Time AI Coaches</h1>
  <p class="sub">Natural voice conversations with live facial lip-sync</p>
</body>
</html>
