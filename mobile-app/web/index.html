<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SpeakFlow AI Language Practice">
  <meta name="referrer" content="no-referrer">

  <!-- Always bypass stale service worker caches on localhost development & silence AppCheck reCAPTCHA noise -->
  <script>
    self.FIREBASE_APPCHECK_DEBUG_TOKEN = "0a0ffdc1-7b08-4a1a-bac9-44bb4647db50";
    window.addEventListener('unhandledrejection', function(event) {
      if (event.reason && (
        event.reason.code === 'appCheck/recaptcha-error' || 
        ('' + event.reason).includes('ReCAPTCHA error') ||
        ('' + event.reason).includes('recaptcha')
      )) {
        event.preventDefault();
      }
    });

    if (window.location.hostname === 'localhost' && 'serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (let reg of regs) { reg.unregister(); }
      });
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (let name of names) { caches.delete(name); }
        });
      }
    }
  </script>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="language_coach_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LangCoach AI</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Inter, Noto Sans Sinhala, Noto Color Emoji & Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons|Material+Icons+Outlined|Material+Icons+Round|Material+Icons+Sharp">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

  <style>
    @font-face {
      font-family: 'MaterialIcons';
      font-style: normal;
      font-weight: 400;
      src: url('fonts/MaterialIcons-Regular.otf') format('opentype'),
           url('https://fonts.gstatic.com/s/materialicons/v142/flUhRq6tzZclQEJ-Vdg-IuiaDsNcIhQ8tQ.woff2') format('woff2');
    }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Prompt Chrome/browser for microphone permission on first user click
    window.addEventListener('click', function requestMicOnce() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(function(stream) {
            stream.getTracks().forEach(function(t) { t.stop(); });
            window.removeEventListener('click', requestMicOnce);
          })
          .catch(function(err) {
            console.log('Microphone permission request:', err);
          });
      }
    }, { once: true });

    // Global audio player instance for fallback streaming audio (CORS-free standard audio)
    window._coachAudio = null;
    let _allVoices = [];

    function cacheVoices() {
      if ('speechSynthesis' in window) {
        _allVoices = window.speechSynthesis.getVoices() || [];
        if (_allVoices.length > 0) {
          console.log("🔊 Browser voices populated:", _allVoices.length, "voices available");
        }
      }
    }
    if ('speechSynthesis' in window) {
      cacheVoices();
      window.speechSynthesis.onvoiceschanged = cacheVoices;
    }

    function playCloudAudioStream(text, shortLang) {
      try {
        console.log("🔊 Playing Cloud TTS audio stream for lang:", shortLang);
        let textToPlay = text.trim();
        if (textToPlay.length > 150) {
          const sentences = textToPlay.split(/(?<=[.!?。！？؟])\s+/);
          if (sentences.length > 0 && sentences[0].trim().length > 0) {
            textToPlay = sentences[0].trim();
          }
          if (textToPlay.length > 150) {
            textToPlay = textToPlay.substring(0, 150);
          }
        }
        const encoded = encodeURIComponent(textToPlay);

        // High-clarity neural voice mapping for languages without local Windows packs
        const seVoices = {
          'ko': 'Seoyeon',
          'ja': 'Mizuki',
          'ar': 'Zeina',
          'ta': 'Valluvar',
          'es': 'Lucia',
          'en': 'Joanna'
        };
        const seVoice = seVoices[shortLang];

        // 1. Primary: StreamElements CORS-enabled high-quality Neural TTS (Amazon Polly / Google Neural)
        // 2. Secondary fallback: Google Translate TTS without referrer
        const primaryUrl = seVoice 
          ? ('https://api.streamelements.com/kappa/v2/speech?voice=' + seVoice + '&text=' + encoded)
          : ('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' + shortLang + '&q=' + encoded);

        const fallbackUrl = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=' + shortLang + '&q=' + encoded;

        const audio = new Audio();
        audio.referrerPolicy = 'no-referrer';
        audio.src = primaryUrl;
        audio.playbackRate = 1.0;
        window._coachAudio = audio;

        let triedFallback = false;

        audio.oncanplay = function() {
          console.log("🔊 Cloud audio stream loaded, playing now...");
          audio.play().catch(function(err) {
            console.warn("Audio play() blocked by browser autoplay policy:", err);
            window.dispatchEvent(new CustomEvent('coachSpeechEnded'));
          });
        };
        audio.onended = function() {
          console.log("🔊 Cloud audio FINISHED playing");
          window.dispatchEvent(new CustomEvent('coachSpeechEnded'));
        };
        audio.onerror = function(err) {
          if (!triedFallback) {
            triedFallback = true;
            console.warn("🔊 Primary cloud TTS stream failed, trying fallback stream...");
            audio.src = fallbackUrl;
            audio.load();
            return;
          }
          console.warn("🔊 Cloud audio error:", err);
          window.dispatchEvent(new CustomEvent('coachSpeechEnded'));
        };

        audio.load();
      } catch (e) {
        console.error("playCloudAudioStream error:", e);
        window.dispatchEvent(new CustomEvent('coachSpeechEnded'));
      }
    }

    // High-fidelity Multilingual Voice Synthesis for AI Coach Voice (All 20 Languages)
    function destroyCoachAudio() {
      if (window._coachAudio) {
        try {
          window._coachAudio.onplaying = null;
          window._coachAudio.ontimeupdate = null;
          window._coachAudio.onended = null;
          window._coachAudio.onerror = null;
          window._coachAudio.pause();
          window._coachAudio.removeAttribute('src');
          window._coachAudio.load();
          window._coachAudio = null;
        } catch (_) {}
      }
    }

    window.speakWebText = function(text, lang, coach, gender) {
      try {
        console.log("🔊 speakWebText called with text:", text, "(lang:", lang, "coach:", coach, "gender:", gender, ")");
        if (!text || text.trim() === '') {
          window.dispatchEvent(new CustomEvent('coachSpeechEnded'));
          return;
        }

        const speechId = (window._activeSpeechId || 0) + 1;
        window._activeSpeechId = speechId;

        // Stop any previous audio or fallback synthesis immediately
        destroyCoachAudio();
        if ('speechSynthesis' in window) {
          try { window.speechSynthesis.cancel(); } catch (_) {}
        }

        let hasEnded = false;
        let hasStarted = false;
        let fallbackActivated = false;
        let safetyTimeout = null;
        let loadTimeout = null;

        function notifySpeechStarted() {
          if (speechId !== window._activeSpeechId) return;
          if (!hasStarted) {
            hasStarted = true;
            if (loadTimeout) {
              clearTimeout(loadTimeout);
              loadTimeout = null;
            }
            console.log("🔊 TTS playback actually started! Dispatching coachSpeechStarted");
            window.dispatchEvent(new CustomEvent('coachSpeechStarted'));

            const estPlaySec = (window._coachAudio && window._coachAudio.duration && !isNaN(window._coachAudio.duration) && window._coachAudio.duration > 0)
              ? Math.ceil(window._coachAudio.duration) + 5
              : Math.max(15, Math.ceil(text.length / 8) + 8);

            if (safetyTimeout) clearTimeout(safetyTimeout);
            safetyTimeout = setTimeout(function() {
              if (!hasEnded && speechId === window._activeSpeechId) {
                console.warn("⚠️ Audio playback watchdog (" + estPlaySec + "s), forcing finishSpeech");
                finishSpeech("playback_watchdog");
              }
            }, estPlaySec * 1000);
          }
        }

        function finishSpeech(reason) {
          if (loadTimeout) {
            clearTimeout(loadTimeout);
            loadTimeout = null;
          }
          if (safetyTimeout) {
            clearTimeout(safetyTimeout);
            safetyTimeout = null;
          }
          if (!hasEnded && speechId === window._activeSpeechId) {
            hasEnded = true;
            console.log("🔊 TTS speech finished. Reason:", reason);
            window.dispatchEvent(new CustomEvent('coachSpeechEnded'));
          }
        }

        function triggerSingleFallback(reason) {
          if (fallbackActivated || hasStarted || hasEnded || speechId !== window._activeSpeechId) return;
          fallbackActivated = true;
          if (loadTimeout) {
            clearTimeout(loadTimeout);
            loadTimeout = null;
          }
          // CRITICAL: Abort & destroy network Audio stream BEFORE speaking fallback so TWO VOICES NEVER OVERLAP!
          destroyCoachAudio();
          fallbackWebSpeech(
            text,
            lang,
            gender || 'female',
            () => finishSpeech(reason),
            () => {
              if (speechId === window._activeSpeechId && !hasEnded) {
                hasStarted = true;
                window.dispatchEvent(new CustomEvent('coachSpeechStarted'));
              }
            }
          );
        }

        const rawCoach = String(coach || 'alex');
        const isOfflineOnly = rawCoach.endsWith('_offline');
        const cleanCoach = rawCoach.replace(/_offline$/, '');

        // In Offline / In-Flight Mode, speak instantaneously via local speechSynthesis (0ms wait, zero network calls!)
        if (isOfflineOnly) {
          triggerSingleFallback("offline_local_tts");
          return;
        }

        // PRIMARY: Stream Microsoft Edge Neural TTS directly from Next.js server (Port 3001)
        const coachParam = encodeURIComponent(cleanCoach);
        const genderParam = encodeURIComponent(gender || 'female');
        const ttsUrl = 'http://localhost:3001/api/tts?text=' + encodeURIComponent(text) + '&coach=' + coachParam + '&gender=' + genderParam + '&language=' + encodeURIComponent(lang || 'English');
        
        const audio = new Audio(ttsUrl);
        audio.crossOrigin = 'anonymous';
        audio.volume = 1.0;
        window._coachAudio = audio;

        audio.onplaying = function() {
          if (fallbackActivated || speechId !== window._activeSpeechId) { destroyCoachAudio(); return; }
          notifySpeechStarted();
        };

        audio.ontimeupdate = function() {
          if (fallbackActivated || speechId !== window._activeSpeechId) { destroyCoachAudio(); return; }
          if (audio.currentTime > 0.04) {
            notifySpeechStarted();
          }
        };

        audio.onended = function() {
          if (!fallbackActivated) finishSpeech("track_ended");
        };

        audio.onerror = function(err) {
          console.warn("🔊 Edge Neural TTS error, switching to local speech synthesis:", err);
          triggerSingleFallback("error_fallback");
        };

        // Fast 4.5-second network buffering timeout: if TTS stream stalls, kill audio & fall back cleanly
        loadTimeout = setTimeout(function() {
          if (!hasStarted && !hasEnded && !fallbackActivated && speechId === window._activeSpeechId) {
            console.warn("⚠️ Edge Neural TTS buffer stalled (>4.5s), aborting stream & switching cleanly to single fallback voice");
            triggerSingleFallback("buffer_timeout_fallback");
          }
        }, 4500);

        const playPromise = audio.play();
        if (playPromise !== undefined) {
          playPromise.then(function() {
            if (fallbackActivated || speechId !== window._activeSpeechId) {
              destroyCoachAudio();
            }
          }).catch(function(err) {
            console.warn("audio.play() rejected:", err);
            triggerSingleFallback("autoplay_fallback");
          });
        }
      } catch (e) {
        console.error("speakWebText exception:", e);
        window.dispatchEvent(new CustomEvent('coachSpeechEnded'));
      }
    };

    function fallbackWebSpeech(text, lang, gender, onFinish, onStart) {
      if (!('speechSynthesis' in window)) {
        if (onFinish) onFinish();
        return;
      }
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        const targetLang = String(lang || 'en-US').toLowerCase();
        const targetPrefix = targetLang.split(/[-_]/)[0];
        const wantFemale = String(gender || 'female').toLowerCase() === 'female';

        const voices = window.speechSynthesis.getVoices() || [];
        const langVoices = voices.filter((v) => String(v.lang || '').toLowerCase().startsWith(targetPrefix));
        if (langVoices.length > 0) {
          const femaleHints = ['zira', 'aria', 'jenny', 'sonia', 'hazel', 'susan', 'denise', 'elsa', 'katja', 'elvira', 'nanami', 'sunhi', 'xiaoxiao', 'female', 'woman'];
          const maleHints = ['david', 'mark', 'guy', 'ryan', 'george', 'henri', 'keita', 'injoon', 'alvaro', 'diego', 'killian', 'male', 'man'];
          const matchedVoice = langVoices.find((v) => {
            const vn = v.name.toLowerCase();
            if (wantFemale) return femaleHints.some((h) => vn.includes(h)) && !maleHints.some((m) => vn.includes(m));
            return maleHints.some((h) => vn.includes(h)) && !femaleHints.some((f) => vn.includes(f));
          });
          u.voice = matchedVoice || langVoices[0];
        }

        u.lang = lang || 'en-US';
        u.rate = 0.98;
        u.pitch = wantFemale ? 1.05 : 0.95;
        u.onstart = function() {
          if (onStart) onStart();
        };
        u.onend = function() { if (onFinish) onFinish(); };
        u.onerror = function() { if (onFinish) onFinish(); };
        window.speechSynthesis.speak(u);
      } catch (_) {
        if (onFinish) onFinish();
      }
    }

    window.stopWebSpeech = function() {
      try {
        window._activeSpeechId = (window._activeSpeechId || 0) + 1;
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
        }
        destroyCoachAudio();
      } catch (_) {}
    };

    // Outgoing Phone Ring Synthesizer (Pure Web Audio API - Zero Assets)
    window.playCallRingtone = function() {
      try {
        window.stopCallRingtone();
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        window._ringerCtx = ctx;

        function triggerRing() {
          if (!window._ringerCtx) return;
          const now = ctx.currentTime;
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();

          osc1.type = 'sine';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(440, now);
          osc2.frequency.setValueAtTime(480, now);

          gain.gain.setValueAtTime(0.04, now); // Gentle, subtle volume
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 1.2);
          osc2.stop(now + 1.2);
        }

        triggerRing();
        window._ringInterval = setInterval(triggerRing, 2800);
      } catch (e) {
        console.warn("Ringtone error:", e);
      }
    };

    window.stopCallRingtone = function() {
      try {
        if (window._ringInterval) {
          clearInterval(window._ringInterval);
          window._ringInterval = null;
        }
        if (window._ringerCtx) {
          window._ringerCtx.close();
          window._ringerCtx = null;
        }
      } catch (_) {}
    };

    // Chrome Built-in AI (Gemini Nano) Local Inference Bridge
    window.promptGeminiNano = async function(promptText, language) {
      try {
        if (window.ai && window.ai.languageModel) {
          const session = await window.ai.languageModel.create({
            systemPrompt: "You are an On-Device AI Language Coach running on Gemini Nano in " + language + ". Evaluate user speech and return JSON with: hasCorrection (bool), original (str), correction (str), explanation (str), spokenReply (str), targetPhrase (str), nextQuestion (str)."
          });
          const result = await session.prompt(promptText);
          if (session.destroy) session.destroy();
          return result;
        }
      } catch (err) {
        console.info("window.ai Gemini Nano check:", err);
      }
      return null;
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
