name: language_coach_app
description: "AI Real-Time Voice Language Coach with Live Captions and Instant Grammar Corrections"
publish_to: 'none'
version: 1.0.4+6

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0
  http: ^1.2.2
  google_fonts: ^6.2.1
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  audioplayers: ^6.4.0
  purchases_flutter: ^11.0.1
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/coaches/
    - assets/videos/
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: fonts/MaterialIcons-Regular.otf

