<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" className="w-full h-full">
  <defs>
    <!-- Radial Outer Fire Glow -->
    <radialGradient id="halo" cx="50%" cy="58%" r="50%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.2"/>
      <stop offset="80%" stop-color="#9a3412" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Deep Glowing Dark Amber Core -->
    <radialGradient id="innerBall" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#2d1205"/>
      <stop offset="65%" stop-color="#160802"/>
      <stop offset="100%" stop-color="#0a0301"/>
    </radialGradient>

    <!-- Ring Fiery Border Gradient -->
    <linearGradient id="flameRing" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="35%" stop-color="#ea580c"/>
      <stop offset="70%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>

    <!-- Rising Central Flame Gradient -->
    <linearGradient id="mainFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="30%" stop-color="#ea580c"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Soft Filter Glow -->
    <filter id="fireGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow Halo Behind -->
  <circle cx="100" cy="115" r="75" fill="url(#halo)"/>

  <!-- Background Fire Flames Rising from Top -->
  <!-- Center Main Flame Tongue -->
  <path d="M 100 12 C 82 45, 68 75, 78 112 C 82 85, 94 55, 100 12 Z" fill="url(#mainFlame)" filter="url(#fireGlow)"/>

  <!-- Left Side Flame Tongue -->
  <path d="M 72 32 C 55 58, 48 85, 58 116 C 62 92, 70 70, 72 32 Z" fill="url(#flameRing)" opacity="0.95"/>

  <!-- Right Side Flame Tongue -->
  <path d="M 128 32 C 145 58, 152 85, 142 116 C 138 92, 130 70, 128 32 Z" fill="url(#flameRing)" opacity="0.95"/>

  <!-- Inner Hot White-Yellow Core Spikes -->
  <path d="M 88 28 C 78 52, 74 76, 84 105 C 88 80, 96 60, 88 28 Z" fill="#fef08a" opacity="0.9"/>
  <path d="M 112 28 C 122 52, 126 76, 116 105 C 112 80, 104 60, 112 28 Z" fill="#fef08a" opacity="0.9"/>

  <!-- Outer Burning Ring with Glowing Stroke -->
  <circle cx="100" cy="115" r="54" fill="url(#innerBall)" stroke="url(#flameRing)" stroke-width="4.5" filter="url(#fireGlow)"/>
  
  <!-- Subtle Inner Ring Highlight -->
  <circle cx="100" cy="115" r="49" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.45"/>
</svg>
